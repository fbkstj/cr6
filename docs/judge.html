<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評審評分</title>
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
</head>
<body>
<header class="topbar">
  <span class="title" id="compName">評審評分</span>
  <span class="spacer"></span>
  <span class="muted small" id="who"></span>
  <button class="btn small" id="logout">登出</button>
</header>
<main id="main"><div class="card"><p class="muted">評審評分頁面建置中（開發階段 P4）。</p></div></main>
<script type="module">
import { requireRole, logout, devBanner } from './assets/app.js';
devBanner();
document.getElementById('logout').addEventListener('click', logout);
const me = await requireRole('judge');
document.getElementById('compName').textContent = me.competition.name;
document.getElementById('who').textContent = me.me.name + '（' + me.me.loginId + '）';
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評審評分</title>
<link rel="stylesheet" href="assets/style.css?v=20261123g">
<script src="config.js"></script>
<style>
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .works { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .work { display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .work:hover { border-color: var(--accent); }
  .score-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr); align-items: start; }
  .score-layout .video-col { position: sticky; top: 64px; }
  @media (max-width: 900px) { .score-layout { grid-template-columns: 1fr; } .score-layout .video-col { position: static; } }
  .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .item-head input { width: 88px; text-align: right; font-size: 1.1rem; }
  .total { font-size: 1.6rem; font-weight: 700; }
  .counter { font-size: .8rem; color: var(--muted); text-align: right; }
  .counter.short { color: var(--bad); }
</style>
</head>
<body>
<header class="topbar">
  <span class="title" id="compName">評審評分</span>
  <span class="chip accent hidden" id="slotChip"></span>
  <span class="spacer"></span>
  <span class="muted small" id="who"></span>
  <button class="btn small" id="pwBtn">修改密碼</button>
  <button class="btn small" id="logout">登出</button>
</header>
<main id="main"><p class="muted">載入中…</p></main>
<script type="module" src="assets/judge.js"></script>
</body>
</html>

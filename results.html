<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收件狀態與比賽結果</title>
<link rel="stylesheet" href="assets/style.css?v=20261123s">
<script src="config.js"></script>
</head>
<body>
<header class="topbar"><span class="title" id="title">專題競賽</span></header>
<main id="main"><p class="muted">載入中…</p></main>
<script type="module">
import { api, esc, fmtTime, devBanner } from './assets/app.js';
import { fromPublic, mountSheetPanel, buildSheets } from './assets/sheet.js?v=20261123s';
devBanner();
const main = document.getElementById('main');
const CHIP = { '未收件': '', '已收件': 'info', '可評分': 'ok', '未進入評分': 'bad', '評分中': 'accent', '已公布': 'ok' };
try {
  const res = await api('publicResults');
  if (res.competition) document.getElementById('title').textContent = res.competition.name;
  if (res.published) {
    document.title = '比賽結果｜' + res.competition.name;
    const card = (t, items) => `<div class="card stack">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">${t.rank ? `第 ${t.rank} 名${t.tied ? '（並列）' : ''}　` : ''}${esc(t.name || t.code)}</h2>
          <span class="chip accent" style="font-size:1rem">平均 ${t.average === null ? '—' : t.average.toFixed(2)} 分</span>
        </div>
        ${t.workTitle ? `<div class="muted">${esc(t.workTitle)}</div>` : ''}
        ${t.tieBroken ? '<div class="small muted">與其他組平均同分，名次由主辦單位依規定決定。</div>' : ''}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          ${t.judges.map(j => `<div class="card" style="box-shadow:none">
            <div class="row" style="justify-content:space-between"><b>${esc(j.label)}</b><span>${j.total} 分</span></div>
            ${j.items && items ? `<div class="small muted">${items.map(i => `${esc(i.title)} ${j.items[i.id] ?? '—'}／${i.max}`).join('　')}</div>` : ''}
            <div class="small" style="margin-top:6px"><b>優點</b><br>${esc(j.strengths)}</div>
            <div class="small" style="margin-top:6px"><b>改進建議</b><br>${esc(j.improvements)}</div>
          </div>`).join('')}
        </div>
      </div>`;
    // 專題組、創意組各自一個排行榜，名次是各組自己的名次
    main.innerHTML = `<div class="card stack"><h1>比賽結果</h1><p class="muted small" style="margin:0">公布時間：${fmtTime(res.publishedAt)}</p></div>
      ${res.categories.map(cat => {
        const ts = res.teams.filter(t => t.category === cat.category).sort((a, b) => (a.rank || 999) - (b.rank || 999));
        return ts.length ? `<h2 style="margin:24px 0 8px">${esc(cat.label)}</h2>${ts.map(t => card(t, cat.items)).join('')}` : '';
      }).join('')}
      <div id="sheet-panel"></div>`;
    mountSheetPanel(document.getElementById('sheet-panel'), fromPublic(res), { onError: e => alert(e.message) });
    // 網址加 #print：只留全部成績表（一張一頁），給瀏覽器「列印→另存 PDF」用
    if (location.hash === '#print') { document.body.className = 'print-all'; document.body.innerHTML = buildSheets(fromPublic(res)).map(s => s.html).join(''); }
  } else {
    const st = await api('publicStatus');
    if (!st.competition) { main.innerHTML = '<div class="card muted">目前沒有進行中的競賽。</div>'; }
    else if (!st.enabled) { main.innerHTML = '<div class="card"><h1>比賽結果尚未公布</h1><p class="muted">請等候主辦單位公布。</p></div>'; }
    else {
      document.title = '收件狀態｜' + st.competition.name;
      main.innerHTML = `<div class="card stack">
        <h1>收件狀態</h1>
        <p class="muted small" style="margin:0">目前階段：${esc(st.competition.phaseLabel)}。比賽結果尚未公布；退回補件的原因由主辦單位另行通知各組。</p>
        <div class="table-wrap"><table><thead><tr><th>類別</th><th>組別</th><th>作品</th><th>狀態</th></tr></thead>
        <tbody>${st.teams.map(t => `<tr><td>${esc(t.categoryLabel || '')}</td><td>${esc(t.name || t.code)}</td><td>${esc(t.workTitle) || '—'}</td>
          <td><span class="chip ${CHIP[t.status] || ''}">${esc(t.status)}</span></td></tr>`).join('') || '<tr><td colspan="4" class="muted">尚無組別</td></tr>'}</tbody></table></div>
      </div>`;
    }
  }
} catch (e) {
  main.innerHTML = `<div class="card notice bad">${esc(e.message)}</div>`;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>下拉選單導覽列範例</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f5f5f2;
  }

  /* ---- 上方導覽列 ---- */
  .navbar {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    background: #4a4a4a;
    color: #fff;
  }
  .navbar > li {
    position: relative;
  }
  .navbar > li > a {
    display: block;
    padding: 14px 20px;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    white-space: nowrap;
  }
  .navbar > li:hover > a,
  .navbar > li.active > a {
    background: #2f2f2f;
  }

  /* ---- 下拉選單本體 ---- */
  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 200px;
    background: #fff;
    color: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    list-style: none;
    margin: 0;
    padding: 6px 0;
    z-index: 100;
  }
  .dropdown li a {
    display: block;
    padding: 10px 18px;
    color: #333;
    text-decoration: none;
    font-size: 14px;
  }
  .dropdown li a:hover {
    background: #f0f0f0;
  }

  /* hover 觸發 (滑鼠移入即顯示) */
  .navbar > li:hover .dropdown {
    display: block;
  }

  /* ---- 圓形捷徑按鈕 ---- */
  .shortcuts {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    padding: 30px 20px;
  }
  .shortcut-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #3b7ddb;
    color: #fff;
    border: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
  }
  .shortcut-btn:hover {
    background: #2f65b3;
  }

  /* ---- 內容框架 ---- */
  .content-frame {
    display: block;
    width: 100%;
    height: 80vh;
    border: none;
  }
</style>
</head>
